# This is a Declarative Automation Bundle definition for taxi_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: taxi_bundle
  uuid: a6874f12-a200-46d8-b2ee-f470a1244847

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7cb97bd5-753f.cloud.databricks.com
    variables:
      catalog: test_catalog
      schema: ${workspace.current_user.short_name}
    resources:
      jobs:
        clean_trips_job:
          schedule:
            pause_status: PAUSED
  prod:
    mode: production
    workspace:
      host: https://dbc-7cb97bd5-753f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sara.bartha@hiq.se to make sure we only have a single copy.
      root_path: /Workspace/Users/sara.bartha@hiq.se/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: test_catalog
      schema: prod
    permissions:
      - user_name: sara.bartha@hiq.se
        level: CAN_MANAGE
